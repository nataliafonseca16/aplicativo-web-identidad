<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad Select</title>

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/jquery-3.6.0.js"></script>
    <script src="js/main.js"></script>
</head>

<body>

    <div class="container">

        <div class="actividad">

            <h2 class="text-center mb-4">
                Selecciona la respuesta correcta
            </h2>

            <div class="row text-center">

                <div class="col-md-4 mb-4">

                    <img src="img/adolescencia.jpg"
                        class="imagen">

                    <select class="form-select mt-3 respuesta" data-correcta="Adolesencia">

                        <option value="">Seleccione</option>
                        <option>Rechazo</option>
                        <option>Adolesencia</option>
                        <option>Encajar</option>

                    </select>

                </div>

      
                <div class="col-md-4 mb-4">

                    <img src="img/encajar.jpg"
                        class="imagen">

                    <select class="form-select mt-3 respuesta" data-correcta="Encajar">

                        <option value="">Seleccione</option>
                        <option>Rechazo</option>
                        <option>Adolesencia</option>
                        <option>Encajar</option>

                    </select>

                </div>

             
                <div class="col-md-4 mb-4">

                    <img src="img/rechazo.jpg"
                        class="imagen">

                    <select class="form-select mt-3 respuesta" data-correcta="Rechazo">

                        <option value="">Seleccione</option>
                        <option>Rechazo</option>
                        <option>Adolesencia</option>
                        <option>Encajar</option>

                    </select>

                </div>

            </div>

            <div class="text-center mt-4">

                <button class="btn btn-success" onclick="verificar()">
                    Verificar
                </button>

                <button class="btn btn-primary" onclick="reiniciar()">
                    Reiniciar
                </button>

            </div>

            <div id="resultado" class="resultado">

            </div>

        </div>

    </div>


    <audio id="audioBien" src="audios/bien.mp3"></audio>
    <audio id="audioMal" src="audios/twin.mp3"></audio>
    <audio id="audioAplausos" src="audios/aplausos.mp3"></audio>

  
 

</body>

</html>
